services:
  db:
    image: postgres:15-alpine
    container_name: salute_vpn_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - vpn_network

  salute_vpn_bot:
    build: .
    container_name: salute_vpn_prod
    restart: always
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - vpn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer
    container_name: salute_vpn_adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - vpn_network

volumes:
  pgdata:

networks:
  vpn_network:
    driver: bridge